name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'customroutes/custom-routes-android'
    runs-on: ubuntu-24.04
    env:
      EXPECTED_CERT_SHA256: b8adfee49cee6c0dd925d5dccb0250a38054830685715d004bbdf1998d63bf1c
      SIGNING_KEY_ALIAS: custom-routes-release

    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install signing tools
        run: sdkmanager "build-tools;34.0.0"

      - name: Validate release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(awk -F'"' '/^[[:space:]]*versionName = / { print $2; exit }' app/build.gradle.kts)"
          version_code="$(awk '/^[[:space:]]*versionCode = / { print $3; exit }' app/build.gradle.kts)"
          test -n "$version_name"
          test -n "$version_code"
          test "$GITHUB_REF_NAME" = "v$version_name"
          test -f "fastlane/metadata/android/en-US/changelogs/$version_code.txt"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Build and verify
        run: ./gradlew clean test lintDebug assembleDebug assembleRelease --no-daemon

      - name: Sign and verify APK
        id: apk
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYSTORE_BASE64"
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_PASSWORD"

          keystore="$RUNNER_TEMP/custom-routes-release.jks"
          unsigned_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          signed_apk="$RUNNER_TEMP/custom-routes-${{ steps.release.outputs.version_name }}.apk"
          checksum="$signed_apk.sha256"
          apksigner="$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"
          zipalign="$ANDROID_SDK_ROOT/build-tools/34.0.0/zipalign"

          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          test -f "$unsigned_apk"

          "$apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:SIGNING_STORE_PASSWORD \
            --key-pass env:SIGNING_KEY_PASSWORD \
            --out "$signed_apk" \
            "$unsigned_apk"

          "$apksigner" verify --verbose --print-certs "$signed_apk"
          "$zipalign" -c -p 4 "$signed_apk"
          actual_cert_sha256="$(
            "$apksigner" verify --print-certs "$signed_apk" |
              awk -F': ' '/Signer #1 certificate SHA-256 digest:/ { print $2; exit }'
          )"
          test "$actual_cert_sha256" = "$EXPECTED_CERT_SHA256"

          cd "$RUNNER_TEMP"
          sha256sum "$(basename "$signed_apk")" > "$(basename "$checksum")"
          echo "signed_apk=$signed_apk" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.apk.outputs.signed_apk }}" \
            "${{ steps.apk.outputs.checksum }}" \
            --verify-tag \
            --title "Custom Routes ${{ steps.release.outputs.version_name }}" \
            --notes-file "fastlane/metadata/android/en-US/changelogs/${{ steps.release.outputs.version_code }}.txt"
